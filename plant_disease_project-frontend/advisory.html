<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Treatment and IPM advisory based on your latest AI scan.">
  <title>Agrigaurd | Advisory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="skip.main">Skip to main content</a>

  <div id="shell-nav"></div>

  <main id="main-content" class="subpage-main" role="main">
    <div class="container subpage-narrow">
      <header class="section-header">
        <h1 class="section-title" data-i18n="advisory.title">Treatment & IPM Advisory</h1>
        <p class="section-subtitle" data-i18n="advisory.subtitle">Guidance based on your latest AI scan.</p>
      </header>

      <div id="advisoryContent">
        <div class="scanner-card">
          <h2 id="diseaseName" data-i18n="advisory.loading">Loading...</h2>
          <p id="confidence"></p>

          <hr class="advisory-divider">

          <h3 class="advisory-heading" data-i18n="advisory.recommendedTreatment">Recommended Treatment</h3>
          <p id="treatment"></p>

          <h3 class="advisory-heading" data-i18n="advisory.prevention">Prevention</h3>
          <p id="prevention"></p>

          <h3 class="advisory-heading" data-i18n="advisory.important">Important</h3>
          <p id="important"></p>
        </div>

        <div class="scanner-card advisory-ipm">
          <h2 data-i18n="advisory.ipm">Integrated Pest Management</h2>
          <ul id="ipmList"></ul>
        </div>

        <p id="noScanBlock" hidden>
          <a href="/" class="btn btn-primary btn-lg" data-i18n="advisory.scanAgain">Scan a Leaf</a>
        </p>
      </div>
    </div>
  </main>

  <div id="shell-footer"></div>

  <script type="module">
    import { initI18n, t } from '/src/i18n.js';
    import { initShell } from '/src/nav.js';

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function prettyDisease(name) {
      if (!name) return t('history.unknownDisease');
      return String(name)
        .replace(/___/g, ' — ')
        .replace(/_/g, ' ');
    }

    function render() {
      const diseaseName = document.getElementById('diseaseName');
      const confidence = document.getElementById('confidence');
      const treatment = document.getElementById('treatment');
      const prevention = document.getElementById('prevention');
      const important = document.getElementById('important');
      const ipmList = document.getElementById('ipmList');
      const noScanBlock = document.getElementById('noScanBlock');

      const ipmItems = t('advisory.ipmItems');
      if (ipmList && Array.isArray(ipmItems)) {
        ipmList.innerHTML = ipmItems
          .map((item) => `<li>${escapeHtml(item)}</li>`)
          .join('');
      }

      prevention.textContent = t('advisory.preventionDefault');
      important.textContent = t('advisory.importantDefault');

      const raw = sessionStorage.getItem('agrigaurd_latest_scan');

      if (!raw) {
        if (noScanBlock) noScanBlock.hidden = false;
        diseaseName.textContent = t('advisory.noScan');
        confidence.textContent = t('advisory.noScanHint');
        treatment.textContent = t('advisory.noTreatment');
        return;
      }

      const data = JSON.parse(raw);

      diseaseName.textContent = prettyDisease(data.disease) || t('advisory.noScan');

      if (data.confidence !== undefined) {
        const value = Number(data.confidence);
        if (Number.isFinite(value)) {
          confidence.textContent =
            `${t('advisory.confidence')}: ${Math.round(value * 10) / 10}%`;
        }
      }

      treatment.textContent = data.remedy || t('advisory.noTreatment');
    }

    async function init() {
      await initI18n();
      initShell({ page: 'advisory' });
      render();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
