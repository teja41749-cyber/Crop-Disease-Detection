<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Weather-based crop disease risk for farmers.">
  <title>Agrigaurd | Weather Risk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="skip.main">Skip to main content</a>

  <div id="shell-nav"></div>

  <main id="main-content" class="subpage-main" role="main">
    <div class="container subpage-narrow">
      <header class="section-header">
        <h1 class="section-title" data-i18n="weather.title">Weather Disease Risk</h1>
        <p class="section-subtitle" data-i18n="weather.subtitle">Weather conditions that may increase crop disease risk.</p>
      </header>

      <div class="scanner-card weather-content">
        <div id="weatherState" class="state-msg" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span data-i18n="weather.loading">Loading weather...</span>
        </div>

        <div id="weatherContent" hidden>
          <div class="weather-risk-block">
            <div class="weather-risk-header">
              <span class="weather-risk-title" data-i18n="weather.risk">Disease Risk</span>
              <span class="risk-badge" id="weatherRiskBadge"></span>
            </div>
            <p class="risk-explanation" id="weatherExplanation"></p>
            <div class="risk-metrics" id="weatherMetrics">
              <div class="risk-metric">
                <span class="risk-metric-label" data-i18n="weather.temperature">Temperature</span>
                <span class="risk-metric-value" id="weatherTemp"></span>
              </div>
              <div class="risk-metric">
                <span class="risk-metric-label" data-i18n="weather.humidity">Relative Humidity</span>
                <span class="risk-metric-value" id="weatherHumidity"></span>
              </div>
              <div class="risk-metric">
                <span class="risk-metric-label" data-i18n="weather.rainfall">Rainfall</span>
                <span class="risk-metric-value" id="weatherRain"></span>
              </div>
              <div class="risk-metric">
                <span class="risk-metric-label" data-i18n="weather.precipitation">Daily Precipitation</span>
                <span class="risk-metric-value" id="weatherPrecipitation"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="shell-footer"></div>

  <script type="module">
    import { getWeatherRisk } from '/src/api.js';
    import { initI18n, t, getCurrentLang } from '/src/i18n.js';
    import { initShell } from '/src/nav.js';

    function getLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude
            });
          },
          () => resolve(null),
          {
            enableHighAccuracy: true,
            timeout: 8000,
            maximumAge: 300000
          }
        );
      });
    }

    function formatValue(value) {
      const num = Number(value);
      if (Number.isNaN(num)) return '—';
      return String(Math.round(num * 10) / 10);
    }

    function setState(message, isError = false) {
      const state = document.getElementById('weatherState');
      if (!state) return;

      state.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' +
        escapeHtml(message) + '</span>';
      state.hidden = false;
      state.className = 'state-msg' + (isError ? ' state-error' : '');
      document.getElementById('weatherContent').hidden = true;
    }

    function showWeather(data) {
      const state = document.getElementById('weatherState');
      if (state) state.hidden = true;

      const content = document.getElementById('weatherContent');
      if (content) content.hidden = false;

      const level = String(data.risk_level || '').toLowerCase();
      const levelKey = ['low', 'moderate', 'high'].includes(level)
        ? level
        : null;

      if (!levelKey) {
        showErrorData();
        return;
      }

      const badge = document.getElementById('weatherRiskBadge');
      if (badge) {
        badge.textContent = t(`weather.riskLevels.${levelKey}`);
        badge.className = `risk-badge ${levelKey}`;
      }

      const explanation = document.getElementById('weatherExplanation');
      if (explanation) {
        explanation.textContent = t(`weather.explanations.${levelKey}`);
      }

      const setMetric = (id, value, suffix) => {
        const el = document.getElementById(id);
        if (el) el.textContent = `${formatValue(value)}${t(`weather.units.${suffix}`)}`;
      };

      setMetric('weatherTemp', data.temperature, 'celsius');
      setMetric('weatherHumidity', data.humidity !== undefined ? data.humidity : data.relative_humidity, 'percent');
      setMetric('weatherRain', data.rainfall, 'mm');
      setMetric('weatherPrecipitation', data.precipitation_sum, 'mm');
    }

    function showErrorData() {
      setState(t('weather.error'), true);
    }

    async function loadWeather() {
      setState(t('weather.loading'));

      try {
        const location = await getLocation();
        const latitude = location?.latitude ?? 17.608;
        const longitude = location?.longitude ?? 78.392;

        const data = await getWeatherRisk(latitude, longitude);

        if (!data || !data.risk_level) {
          showErrorData();
          return;
        }

        showWeather(data);
      } catch (error) {
        console.warn('Weather loading failed:', error);
        setState(t('weather.unavailableError'), true);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function init() {
      await initI18n();
      initShell({ page: 'weather' });
      loadWeather();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
