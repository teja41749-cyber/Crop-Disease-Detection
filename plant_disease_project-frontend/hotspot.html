<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Agrigaurd | Disease Hotspots</title>

  <link
    rel="stylesheet"
    href="/src/styles.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    #map {
      width: 100%;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
    }

  </style>

</head>


<body>

<header class="navbar">

  <div class="container navbar-inner">

    <a href="/" class="navbar-brand">
      <span class="navbar-title">
        Agrigaurd
      </span>
    </a>

    <nav class="navbar-nav">

      <a href="/" class="navbar-link">
        Home
      </a>

      <a href="/weather.html" class="navbar-link">
        Weather
      </a>

      <a href="/advisory.html" class="navbar-link">
        Advisory
      </a>

    </nav>

  </div>

</header>


<main class="container" style="padding: 48px 20px;">

  <header class="section-header">

    <h1 class="section-title">
      Crop Disease Hotspots
    </h1>

    <p class="section-subtitle">
      Locations of recorded disease scans.
    </p>

  </header>


  <section class="scanner-card">

    <div id="map"></div>

  </section>

</main>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">

import {
  getScans
} from '/src/api.js';


const map =
  L.map('map').setView(
    [17.608, 78.392],
    10
  );


L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


async function loadHotspots() {

  try {

    const scans =
      await getScans();


    scans
      .filter(scan =>
        scan.latitude !== null &&
        scan.longitude !== null
      )
      .forEach(scan => {

        const marker =
          L.marker([
            scan.latitude,
            scan.longitude
          ]).addTo(map);


        marker.bindPopup(`
          <strong>
            ${scan.disease || 'Unknown'}
          </strong>
          <br>
          Confidence:
          ${
            Number(scan.confidence * 100)
              .toFixed(1)
          }%
          <br>
          ${
            scan.confirmed === 1
              ? 'Confirmed'
              : scan.confirmed === 0
                ? 'Not confirmed'
                : 'Not reviewed'
          }
          <br>
          ${
            scan.created_at || ''
          }
        `);

      });

  } catch (error) {

    console.error(
      'Hotspot loading failed:',
      error
    );

  }

}


loadHotspots();

</script>

</body>
</html>
