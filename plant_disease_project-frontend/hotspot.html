<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Map of recorded crop disease scans.">
  <title>Agrigaurd | Disease Hotspots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <a href="#main-content" class="skip-link" data-i18n="skip.main">Skip to main content</a>

  <div id="shell-nav"></div>

  <main id="main-content" class="subpage-main" role="main">
    <div class="container subpage-narrow">
      <header class="section-header">
        <h1 class="section-title" data-i18n="hotspot.title">Crop Disease Hotspots</h1>
        <p class="section-subtitle" data-i18n="hotspot.subtitle">Locations of recorded disease scans.</p>
      </header>

      <div id="mapState" class="state-msg" role="status" hidden></div>

      <section class="scanner-card">
        <div id="map" class="hotspot-map" role="application" aria-label="Hotspot map"></div>
      </section>
    </div>
  </main>

  <div id="shell-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { getScans } from '/src/api.js';
    import { initI18n, t } from '/src/i18n.js';
    import { initShell } from '/src/nav.js';

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setMapState(message, isError = false) {
      const state = document.getElementById('mapState');
      if (!state) return;

      state.hidden = false;
      state.className = 'state-msg' + (isError ? ' state-error' : '');
      state.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' +
        escapeHtml(message) + '</span>';
    }

    function hideMapState() {
      const state = document.getElementById('mapState');
      if (state) state.hidden = true;
    }

    const map = L.map('map').setView([17.608, 78.392], 10);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);

    async function loadHotspots() {
      try {
        setMapState(t('hotspot.loading'));

        const scans = await getScans();

        const located = (scans || []).filter((scan) =>
          scan.latitude !== null &&
          scan.latitude !== undefined &&
          scan.longitude !== null &&
          scan.longitude !== undefined
        );

        if (!located.length) {
          setMapState(t('hotspot.empty'));
          return;
        }

        hideMapState();

        located.forEach((scan) => {
          const confidence = Number.isFinite(Number(scan.confidence))
            ? `${Math.round(Number(scan.confidence) * 1000) / 10}%`
            : '—';

          const statusKey = scan.confirmed === 1
            ? 'hotspot.confirmed'
            : scan.confirmed === 0
              ? 'hotspot.notConfirmed'
              : 'hotspot.notReviewed';

          const marker = L.marker([
            scan.latitude,
            scan.longitude
          ]).addTo(map);

          marker.bindPopup(`
            <strong>${escapeHtml(scan.disease || t('hotspot.unknown'))}</strong>
            <br>
            ${escapeHtml(t('hotspot.confidence'))}: ${confidence}
            <br>
            ${escapeHtml(t(statusKey))}
            <br>
            ${escapeHtml(scan.created_at || '')}
          `);
        });
      } catch (error) {
        console.warn('Hotspot loading failed:', error);
        setMapState(t('hotspot.error'), true);
      }
    }

    async function init() {
      await initI18n();
      initShell({ page: 'hotspots' });
      loadHotspots();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
